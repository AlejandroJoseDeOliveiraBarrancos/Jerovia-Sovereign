# Pre-commit configuration for the rag-engine service.
#
# The git repository root is the monorepo root, so install this config explicitly:
#     make -C services/rag-engine pre-commit
# (equivalent to `pre-commit install -c <this file>`), or run
#     pre-commit run -c services/rag-engine/.pre-commit-config.yaml --all-files
exclude: '^services/rag-engine/(\.venv|htmlcov|coverage\.xml|\.mypy_cache|\.ruff_cache|\.pytest_cache)/'

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  # Type checking runs through the Makefile target so the hook, `make check` and CI
  # all use one mypy configuration (mypy_path is relative to the service root, which
  # a repo-root hook process would resolve incorrectly).
  - repo: local
    hooks:
      - id: mypy
        name: mypy (services/rag-engine)
        entry: make -C services/rag-engine typecheck
        language: system
        pass_filenames: false
        files: ^services/rag-engine/(src|tests)/
        types: [python]
